<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>EB 409-03 Materials Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: steel-and-hi-vis field logbook. Navy header band, hazard stripe, list rows like a delivery-note register. */
:root{
  --bg:#E9EEF0; --panel:#FFFFFF; --panel2:#F3F6F7; --ink:#14232C; --muted:#566872; --line:#D2DBDF;
  --navy:#12303F; --on-navy:#F2F6F8; --accent:#D9480F; --on-accent:#FFFFFF;
  --ok:#1E7B4F; --warn:#8A5A00; --bad:#B42318; --chip:#DCE6EA; --stA:#1B6E8C; --stS:#8A5A00; --stD:#566872; --stU:#1E7B4F; --on-st:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161B; --panel:#16222A; --panel2:#1C2B34; --ink:#E4ECF0; --muted:#8FA2AD; --line:#2A3B45;
    --navy:#0A1E28; --on-navy:#E4ECF0; --accent:#FF8340; --on-accent:#1A0E06;
    --ok:#4CC38A; --warn:#E3B341; --bad:#FF8A7A; --chip:#223540; --stA:#6CC4E0; --stS:#E3B341; --stD:#8FA2AD; --stU:#4CC38A; --on-st:#0E161B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161B; --panel:#16222A; --panel2:#1C2B34; --ink:#E4ECF0; --muted:#8FA2AD; --line:#2A3B45;
  --navy:#0A1E28; --on-navy:#E4ECF0; --accent:#FF8340; --on-accent:#1A0E06;
  --ok:#4CC38A; --warn:#E3B341; --bad:#FF8A7A; --chip:#223540; --stA:#6CC4E0; --stS:#E3B341; --stD:#8FA2AD; --stU:#4CC38A; --on-st:#0E161B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:18px 56px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy)}
#hdr .wrap{display:flex;align-items:center;gap:12px;min-height:52px}
#hdr .back{display:inline-flex;align-items:center;min-height:40px;padding:0 4px;text-decoration:none;font-weight:500;white-space:nowrap}
#hdr .ttl{flex:1;min-width:0;font:600 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border:1px solid rgba(255,255,255,.28);border-radius:4px;background:transparent;color:var(--on-navy);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#8FA2AD;flex:none}
.dot.shared{background:#4CC38A}.dot.local{background:#E3B341}.dot.error{background:#FF8A7A}
.stripe{height:6px;background:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--navy) 10px 20px)}

/* generic */
.ph{margin-bottom:14px}
h1{font:700 34px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
h2{font:600 22px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px}
h3{font:600 17px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px;color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h3{color:var(--ink)}}
:root[data-theme="dark"] h3{color:var(--ink)}
.sub{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:140px}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel);min-height:36px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--on-navy)}
.chip{display:inline-block;padding:1px 8px;border-radius:3px;background:var(--chip);font-size:12.5px;font-weight:500;letter-spacing:.02em}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.off{color:var(--muted)}
.empty{padding:22px 14px;color:var(--muted);background:var(--panel)}
section.blk{margin-top:26px}
.pgtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.pgtools input[type=search]{flex:1;min-width:180px}
.pgtools label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pv{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto}
.pv-top{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--navy);color:var(--on-navy)}
.pv-page{max-width:1000px;margin:16px auto 40px;padding:0 16px}
.pv-head{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);padding:12px 16px;margin-bottom:14px}
.pv-b{font-weight:700;font-size:18px}
.row[hidden],section[hidden]{display:none!important}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--navy);color:var(--on-navy);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--accent)}
.pbar[hidden]{display:none}
.pbar span{flex:1;min-width:160px;font-size:13.5px}
body.hasbar{padding-bottom:70px}
body.hasbar .dlbar{bottom:62px}
body.hasbar #toast{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.no{display:inline-block;min-width:24px;color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:500;margin-right:4px}

/* login */
.login{max-width:460px;margin:8vh auto 0}
.login .card{background:var(--panel);border:1px solid var(--line);padding:22px;margin-top:0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.who .btn{min-height:52px;font-size:17px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

/* menu */
.hero{padding-block:6px 18px}
.hero .big{font:700 clamp(46px,12vw,84px)/.9 var(--display);letter-spacing:.02em;text-transform:uppercase}
.hero .big span{color:var(--accent)}
.hero p{margin:6px 0 0;color:var(--muted)}
.hero.has-photo{display:flex;align-items:center;gap:16px}
.tile-n{white-space:nowrap}
.avatar.logo{border-radius:14px;object-fit:contain;object-position:center;background:#fff;padding:6px;width:auto;height:92px;aspect-ratio:231/210}
@media(min-width:700px){.avatar.logo{width:auto;height:110px}}
#wm{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center top;background-repeat:no-repeat;background-size:cover;opacity:.08;filter:grayscale(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #wm{opacity:.10}}
:root[data-theme="dark"] #wm{opacity:.10}
@media(min-width:800px){#wm{background-size:auto 100%;background-position:right 4vw top}}
@media print{#wm{display:none}}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 40%;border:3px solid var(--accent);box-shadow:0 0 0 4px var(--panel);flex:none;background:var(--navy)}
.cover{position:relative;overflow:hidden;height:350px;border-top:6px solid var(--accent);background:var(--navy)}
.cover img{width:100%;height:100%;object-fit:cover;object-position:50% 90%;display:block}
.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,30,40,.9),rgba(10,30,40,0) 62%)}
.cover .cap{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;color:#fff}
.cover .cap .big{font:700 clamp(46px,12vw,72px)/.9 var(--display);letter-spacing:.02em;text-transform:uppercase}
.cover .cap .big span{color:var(--accent)}
.cover .cap p{margin:6px 0 0;color:#d6e2e8}
@media(min-width:700px){.avatar{width:110px;height:110px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:2px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;text-decoration:none;min-height:118px}
.tile:hover{border-color:var(--accent)}
.tile-k{font:600 16px/1.1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile-n{font:600 36px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin-top:auto}
.tile-s{font-size:13px;color:var(--muted)}
.tile.report{grid-column:1/-1;background:var(--navy);color:var(--on-navy);border-color:var(--navy);min-height:0;flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap}
.tile.report .tile-k{color:var(--on-navy);font-size:24px}
.tile.report .tile-s{color:var(--on-navy);opacity:.8;flex:1;min-width:160px}
.tile.report .btn{pointer-events:none}

/* lists */
.list{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.r-name{font-weight:600;overflow-wrap:anywhere}
.tbr{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;margin-top:5px;cursor:pointer;color:var(--ink2,inherit)}.tbr input{width:16px;height:16px}
.rtgrp h3{margin:18px 0 6px}.rtrow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}.rtrow input{width:18px;height:18px;margin-top:2px}
.r-name button{all:unset;cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.r-name button:focus-visible{outline:2px solid var(--accent)}
.r-sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.r-nums{font:13px var(--mono);color:var(--muted);margin-top:2px}
.r-stock{text-align:right;white-space:nowrap}
.r-stock b{display:block;font:600 24px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.r-stock span{font-size:12.5px;color:var(--muted)}
.r-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.hist{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.mv{display:grid;grid-template-columns:78px 70px minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:13.5px;padding:3px 0}
.mv .t{font-weight:600}.mv .t.in{color:var(--ok)}.mv .t.out{color:var(--accent)}.mv .t.ret{color:var(--warn)}
.mv .d{overflow-wrap:anywhere;color:var(--muted)}
.kv{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.totalbar{display:flex;justify-content:space-between;padding:10px 14px;background:var(--panel2);font-weight:600;border-top:1px solid var(--line)}

/* modal */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,12,16,.6)}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--panel);border-top:4px solid var(--accent);padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));margin:0 max(0px,env(safe-area-inset-left,0px))}
@media (min-width:640px){#modal{align-items:center}.sheet{border:1px solid var(--line);border-top:4px solid var(--accent);padding-bottom:16px}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.sheet-actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.sp{flex:1}
.errline{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}

/* report */
.rp-opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0}
.rp-opts label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.rp-opts input{width:auto;min-height:0}
.rp-top{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:end}
@media (max-width:560px){.rp-top{grid-template-columns:1fr}}
.rp-sec{margin-top:20px}
.tw{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:var(--on-navy);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.bold td{font-weight:700;background:var(--panel2)}
.rp-lang{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:14px}
.rp-lang .lbl{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dlbar{flex-wrap:wrap}
.dlbar{position:sticky;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:22px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:4px;max-width:92%;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast[hidden]{display:none}

/* login */
.picks{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
/* NSC equipment */
.nrow{align-items:center}
.nrow .r-name button{text-align:left}
.stbtns{display:flex;gap:6px}
.stb{width:42px;min-height:42px;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer;font:600 18px/1 var(--display)}
.stb.stA{color:var(--stA);border-color:var(--stA)}.stb.stS{color:var(--stS);border-color:var(--stS)}
.stb.stD{color:var(--stD);border-color:var(--stD)}.stb.stU{color:var(--stU);border-color:var(--stU)}
.stb[aria-pressed=true].stA{background:var(--stA);color:var(--on-st)}.stb[aria-pressed=true].stS{background:var(--stS);color:var(--on-st)}
.stb[aria-pressed=true].stD{background:var(--stD);color:var(--on-st)}.stb[aria-pressed=true].stU{background:var(--stU);color:var(--on-st)}
.chip.stA{background:var(--stA);color:var(--on-st)}.chip.stS{background:var(--stS);color:var(--on-st)}
.chip.stD{background:var(--stD);color:var(--on-st)}.chip.stU{background:var(--stU);color:var(--on-st)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.grid table{width:max-content;min-width:100%}
.grid th,.grid td{padding:4px 3px}
.grid td.gc{text-align:center;min-width:26px;font-weight:700}
.grid td.gc.stA{color:var(--stA)}.grid td.gc.stS{color:var(--stS)}.grid td.gc.stD{color:var(--stD)}.grid td.gc.stU{color:var(--stU)}
.grid td.carried{opacity:.5}
.grid .stick{position:sticky;left:0;z-index:1;background:var(--panel);min-width:170px;max-width:230px;white-space:normal;text-align:left;padding-left:9px}
.grid th.stick{background:var(--navy)}
.grid .sn{color:var(--muted);font-size:12px}
.dh{all:unset;cursor:pointer;padding:2px 4px;font:inherit;font-variant-numeric:tabular-nums}
.dh:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){.tile{transition:border-color .12s}}
</style>

<header id="hdr" hidden><div class="wrap"><a class="back" id="back" href="#menu">&larr; Menu</a><div class="ttl" id="ttl"></div><button class="userbtn" id="userbtn" data-act="switch" title="Switch user"><span class="dot" id="syncdot"></span><span id="uname"></span></button></div></header>
<main class="wrap" id="app"></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var toISO=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var today=function(){return toISO(new Date());};
var fmt=function(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
var dnum=function(iso){var p=iso.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])/864e5;};
var daysOn=function(a,end){return Math.max(0,dnum(end)-dnum(a)+1);};
var N=function(n){var r=Math.round((+n||0)*100)/100;return r.toLocaleString('en-US');};
var uid=function(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var onSite=function(a,e,d){return !!a&&a<=d&&(!e||e>d);};
var P=function(s){return String(s==null?'':s).replace(/[′″“”‶]/g,'"').replace(/[‘’‵]/g,"'").replace(/[–—]/g,'-').replace(/•/g,'-').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g,'?');};

var SUP=['Aymen','Mossaab','Issam','Ammar'];
function isGuest(){return !!user&&/^(ghest|guest)$/i.test(user);}
var KEYS=['rev','headcount','crew','rentals','mud','cement','casing','acc','bit','store','nsc','diesel','sigma','wellhead'];
var MOVKEYS=['mud','cement','wellhead','casing','acc','bit','store'];
var PW=[49,54,53,51,107];
var ROUTES=['menu','balance','ret','lorder','crew','rentals','mud','cement','wellhead','diesel','sigma','casing','acc','bit','store','nsc','report'];
var GROUPS={
  mud:{title:'Mud products',sub:'Mud products and chemicals: received, consumed, returned.',unit:'kg',kind:'product'},
  cement:{title:'Cement & products',sub:'Cement and cementing products received, consumed and returned, with the running balance.',btn:'Product',unit:'Ton',kind:'product'},
  wellhead:{title:'Wellhead',sub:'Wellhead equipment: received, consumed and returned, with the running balance.',unit:'pcs',kind:'item',btn:'Item'},
  casing:{title:'Casings',sub:'Casings on site: received, consumed and returned, with the running balance.',unit:'m',kind:'casing',btn:'Casing'},
  acc:{title:'Casing accessories',sub:'Shoes, collars, cementing plugs, stop collars, centralizers.',unit:'pcs',kind:'accessory'},
  bit:{title:'Drill bits',sub:'Rock bits and PDC bits.',unit:'pcs',kind:'bit'},
  store:{title:'Store stock',sub:'Warehouse stock list. Log what leaves or comes back.',unit:'pcs',kind:'article'}
};
var TYPES={in:'Received',out:'Consumed',ret:'Returned'};

/* cement used to live in the mud products list: move it to its own list */
function splitCement(o,pref){
  var isC=function(it){return /^\s*CEMENT/i.test(it.name||'');};
  var items=(o.mud||[]).filter(isC);

/* ---------- stock maths ---------- */
function agg(it,d){
  var pin=0,pout=0,pret=0,tin=0,tout=0,tret=0;
  it.mov.forEach(function(m){
    var q=+m.qty||0;
    if(m.date<d){if(m.type==='in')pin+=q;else if(m.type==='out')pout+=q;else pret+=q;}
    else if(m.date===d){if(m.type==='in')tin+=q;else if(m.type==='out')tout+=q;else tret+=q;}
  });
  var open=(+it.opening||0)+pin-pout-pret;
  return {open:open,rin:tin,rout:tout,rret:tret,close:open+tin-tout-tret,cin:pin+tin,cout:pout+tout,cret:pret+tret};
}
var ALL='9999-12-31';

function menuHTML(){
  var t=today();
  var heads=pobTotal(t);
  var crewNow=S.crew.filter(function(c){return onSite(c.arrival,c.departure,t);}).length;
  var rentNow=S.rentals.filter(function(r){return onSite(r.arrival,r.ret,t);}).length;
  var sum=function(k){return S[k].reduce(function(a,it){return a+aggAll(it).close;},0);};
  var inStock=S.mud.filter(function(it){return aggAll(it).close>0;}).length;
  var nc={A:0,S:0,D:0,U:0};S.nsc.forEach(function(x){var e=nscEff(x,t);if(e.code)nc[e.code]++;});
  var tile=function(h,k,n,s){return '<a class="tile" href="#'+h+'"><span class="tile-k">'+k+'</span><span class="tile-n">'+n+'</span><span class="tile-s">'+s+'</span></a>';};
  return '<div class="hero has-photo"><img class="avatar logo" src="'+IMG_LOGO+'" alt="SITEP"><div><div class="big">EB 409<span>-</span>03</div><p>Rig CTF-04 &middot; '+fmt(t)+'</p></div></div><div class="stripe"></div>'+
  '<div class="tiles">'+
  tile('crew','Personnel',N(heads),'people on board &middot; '+crewNow+' named crew listed')+
  tile('rentals','Company materials',N(rentNow),'items on site')+
  tile('mud','Mud products',N(inStock),'of '+S.mud.length+' products in stock')+
  tile('cement','Cement &amp; products',S.cement.reduce(function(a,it){return a+aggAll(it).close;},0).toLocaleString('en-US',{maximumFractionDigits:1})+' T','balance on site')+
  tile('wellhead','Wellhead',N(S.wellhead.reduce(function(a,it){return a+aggAll(it).close;},0)),'in stock &middot; '+S.wellhead.length+' item'+(S.wellhead.length===1?'':'s'))+
  tile('diesel','Diesel',N(dieselTotal(ALL))+' L','received to date &middot; '+N(dieselTotal(today(),true))+' L today')+
  tile('sigma','Global Metallic',N(S.sigma.filter(function(x){return onSite(x.arrival,x.ret,today());}).length),'items on site &middot; '+S.sigma.filter(function(x){return x.used==='yes';}).length+' used')+
  tile('ret','Return communication',N(retItems().length),'items to be returned')+
  tile('balance','Product balance',N(S.mud.length+S.cement.length),'products (mud + cement)')+
  tile('lorder','Local material order',N(S.casing.concat(S.acc).filter(function(x){return x.ord;}).length),'items to order')+
  tile('casing','Casings',N(sum('casing')),'m on site')+
  tile('acc','Accessories',N(sum('acc')),'pieces in stock')+
  tile('bit','Drill bits',N(S.bit.filter(function(b){return !b.ret;}).length),'bits on site')+
  tile('store','Store stock',N(S.store.length),'articles listed')+
  tile('nsc','NSC equipment',N(S.nsc.length),'A '+nc.A+' &middot; S '+nc.S+' &middot; D '+nc.D+' &middot; U '+nc.U)+
  '<a class="tile report" href="#report"><span class="tile-k">Daily report</span><span class="tile-s">Pick a date, review the tables, save one PDF.</span><span class="btn primary">Open</span></a>'+
  '</div>'+
  '<section class="blk"><h3>Data backup</h3><p class="sub" style="margin:0 0 10px">Entries are stored in this browser only. Export them to a file to move them to another PC or keep a copy, then import that file on the other PC.</p><div class="toolbar"><button class="btn" data-act="exp">Export data</button><button class="btn" data-act="imp">Import data</button><input type="file" id="impFile" hidden></div></section><p class="hint" style="margin-top:18px">App version: 2026-11-10 (phone import)</p>';
}
function crewHTML(){
  var t=today(),f=ui.crewFilter;
  var rows=S.crew.filter(function(c){return f==='all'||onSite(c.arrival,c.departure,t);}).sort(function(a,b){return (a.company+a.person).localeCompare(b.company+b.person);});
  var heads=pobTotal(t);
  rows=srt(rows,function(c){return c.person;},function(c){return c.company;},function(c){return c.arrival;});
  var cos=Array.from(new Set(S.crew.map(function(c){return c.company;}).concat(S.headcount.map(function(h){return h.company;})))).sort();
  var hc=srt(pobRows(t),function(r){return r.co;},function(r){return r.co;}).map(function(r,ix){
    var btn=r.ids.length?'<button class="btn sm" data-act="hcedit" data-id="'+r.ids[0]+'">Edit number</button>':'<button class="btn sm" data-act="hcadd" data-co="'+esc(r.co)+'">Add number</button>';
    return '<div class="row"><div><div class="r-name"><span class="no">'+(ix+1)+'</span>'+esc(r.co)+'</div><div class="r-sub">'+r.listed+' named crew on site'+(r.extra?' + '+N(r.extra)+' added directly':'')+'</div></div><div class="r-stock"><b>'+N(r.total)+'</b></div><div class="r-act">'+btn+'</div></div>';
  }).join('');
  var cards=rows.map(function(c,ix){
    var gone=c.departure&&c.departure<=t,future=c.arrival>t;

function cementLedger(it){
  var g={},order=[];
  it.mov.forEach(function(m){
    var key=m.grp||m.id;
    if(!g[key]){g[key]={grp:key,date:m.date,bl:'',sup:'',note:'',in:0,out:0,ret:0};order.push(key);}
    var x=g[key];x[m.type]+=(+m.qty||0);
    if(!x.bl&&m.bl)x.bl=m.bl;if(!x.sup&&m.sup)x.sup=m.sup;if(!x.note&&m.note)x.note=m.note;
  });
  var rows=order.map(function(k){return g[k];}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var run=+it.opening||0;
  rows.forEach(function(r){run+=r.in-r.out-r.ret;r.bal=Math.round(run*1000)/1000;});
  return rows;
}

  });

    S[g[0]].forEach(function(it){if(g[0]==='bit'){var bf=function(h,m,dl){var r=[];if(h)r.push(T('bHours')+': '+N(h));if(m)r.push(T('bDepth')+': '+N(m));if(dl)r.push(T('bDull')+': '+dl);return r.join(' | ');};var bw=it.name+(it.sn?' S/N '+it.sn:'');if(it.arr&&match(it.arr))add(it.arr,2+gi,0,[T(g[1]),T('evArr'),bw,'1',it.unit,'','','']);if(it.ret&&match(it.ret))add(it.ret,2+gi,2,[T(g[1]),T('evRet'),bw,'1',it.unit,'','','']);(it.use||[]).forEach(function(u){if(match(u.date))add(u.date,2+gi,1,[T(g[1]),T('evUse'),bw,'',it.unit,'','',bf(u.hours,u.depth,u.dull)]);});return;}it.mov.forEach(function(m){

    });});

    if(x.ret&&match(x.ret))add(x.ret,11,1,[T('catSg'),T('evRet'),what,x.qty!=null&&x.qty!==''?N(x.qty):'',x.unit||'',x.bl||'',x.sup||'',x.obs||''],+x.qty||0);

function buildSecsXlsx(d,secs,nameOf,sub){

    var num=s.num||[],rows=[];
    rows[0]=[C(s.title,'title')];
    rows[1]=[C((sub?sub+'     ':'')+'EB 409-03 • RIG CTF-04     '+fmt(d)+'     '+L('by')+' '+(user||''),'sub')];
    rows[3]=s.head.map(function(h){return C(h,'hdr');});

        return C(v,bold?'bold':'txt');

  var gst=/^(ghest|guest)$/i.test(name);
  if(!gst&&pw!==String.fromCharCode.apply(null,PW)){$('#loginErr').textContent='Wrong password.';$('#uPw').value='';$('#uPw').focus();return;}
  if(/^(ghest|guest)$/i.test(name))name='GHEST';
  user=name;lastUser=name;
  try{localStorage.setItem(LU,name);}catch(e){}
  try{sessionStorage.setItem(SK,'1');}catch(e){}
  if(!location.hash)location.hash='#menu';
  render();
}

  switch(a){
    case 'pick':$('#uName').value=t.getAttribute('data-name');if(/^ghest$/i.test($('#uName').value)){$('#uPw').value='';doLogin();}else $('#uPw').focus();break;
    case 'switch':user=null;try{sessionStorage.removeItem(SK);}catch(x){}render();break;
    case 'closeform':closeForm();break;
    case 'additem':itemForm(k);break;
    case 'edititem':itemForm(k,id);break;
    case 'mov':movForm(k,id);break;
    case 'movedit':movForm(k,t.getAttribute('data-item'),id);break;
    case 'usage':usageForm(id);break;
    case 'useedit':usageForm(t.getAttribute('data-item'),id);break;
    case 'hist':ui.open[id]=!ui.open[id];$('#list').innerHTML=listRows(k);break;
    case 'crewadd':crewForm();break;
    case 'crewedit':crewForm(id);break;
    case 'crewout':var c=S.crew.find(function(x){return x.id===id;});if(c){c.departure=today()<c.arrival?c.arrival:today();commit('crew');render();}break;
    case 'rentadd':rentForm();break;
    case 'rentedit':rentForm(id);break;
    case 'rentret':var r=S.rentals.find(function(x){return x.id===id;});if(r){r.ret=today()<r.arrival?r.arrival:today();commit('rentals');render();}break;
    case 'cmadd':ledgerForm(k,t.getAttribute('data-item'));break;
    case 'cmedit':ledgerForm(k,t.getAttribute('data-item'),id);break;
    case 'sgadd':sigmaForm();break;
    case 'sgedit':sigmaForm(id);break;
    case 'sgused':var sx=S.sigma.find(function(x){return x.id===id;});if(sx){sx.used='yes';commit('sigma');render();}break;
    case 'sgret':var sr=S.sigma.find(function(x){return x.id===id;});if(sr){sr.ret=today()<sr.arrival?sr.arrival:today();commit('sigma');render();}break;
    case 'dsadd':dieselForm();break;
    case 'dsedit':dieselForm(id);break;
    case 'rppv':openPreview('report');break;
    case 'mvpv':openPreview('mv');break;
    case 'retpv':ui.retPv=!ui.retPv;render();break;
    case 'lopv':ui.loPv=!ui.loPv;render();break;
    case 'balsave':balSave(t.getAttribute('data-v'));break;
    case 'lodoc':(async function(){var buf;try{buf=loDocx();}catch(e){try{console.error(e);}catch(x){}toast('Could not build the Word file.');return;}await saveFile('Commande_materiel_local_'+today()+'.docx',buf,'Word file saved.');})();break;
    case 'cmu':ui.cmU=t.getAttribute('data-v')==='l'?'l':'gal';try{localStorage.setItem('eb409.cmu',ui.cmU);}catch(x){}render();break;
    case 'retall':retItems().forEach(function(o){ui.retOn[o.key]=t.getAttribute('data-v')==='1';});render();break;
    case 'retdoc':(async function(){var buf;try{buf=retDocx();}catch(e){try{console.error(e);}catch(x){}toast('Could not build the Word file.');return;}await saveFile('CI N\u00b0'+String(ui.ret.ref||nextCI()).replace(/[\\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim()+'.docx',buf,'Word file saved.');var mm=/^409-03\/(\d+)\//.exec(ui.ret.ref||'');if(mm){try{localStorage.setItem('eb409.ci',mm[1]);}catch(x){}ui.ret.ref='';render();}})();break;
    case 'secall':REP.forEach(function(r){ui.rpOn[r[0]]=t.getAttribute('data-v')==='1';});render();break;
    case 'mvall':MVC.forEach(function(o){ui.mvOn[o[0]]=t.getAttribute('data-v')==='1';});render();break;
    case 'rkpv':openPreview(t.getAttribute('data-k'));break;
    case 'rkx':saveRk(t.getAttribute('data-k'),t.getAttribute('data-f'));break;
    case 'pvclose':closePreview();break;
    case 'pvsave':var pk=t.getAttribute('data-v');closePreview();if(pk==='report')savePdf();else saveRk(pk,'pdf');break;
    case 'exp':exportData();break;
    case 'imp':var inp=$('#impFile');if(inp)inp.click();break;
    case 'hcadd':hcForm(null,t.getAttribute('data-co')||'');break;
    case 'hcedit':hcForm(id);break;
    case 'cf':ui.crewFilter=t.getAttribute('data-v');render();break;
    case 'mvpdf':saveMov('pdf');break;
    case 'mvdocx':saveMov('docx');break;
    case 'mvxlsx':saveMov('xlsx');break;
    case 'rxlsx':saveReportXlsx();break;
    case 'docx':saveDocx();break;
    case 'pdf':savePdf();break;
    case 'xlsx':saveXlsx();break;
    case 'lang':ui.rpLang=t.getAttribute('data-v');try{localStorage.setItem('eb409.lang',ui.rpLang);}catch(x){}render();break;
    case 'fmt':ui.rpFmt=t.getAttribute('data-v');try{localStorage.setItem('eb409.fmt',ui.rpFmt);}catch(x){}render();break;
    case 'nscset':var nt=S.nsc.find(function(x){return x.id===id;});if(nt){nt.st=nt.st||{};var cc=t.getAttribute('data-c');if(nt.st[ui.nscDate]===cc)delete nt.st[ui.nscDate];else nt.st[ui.nscDate]=cc;commit('nsc');$('#nscBody').innerHTML=nscBodyHTML();}break;
    case 'nscprev':ui.nscDate=shiftDay(ui.nscDate,-1);render();break;
    case 'nscnext':ui.nscDate=shiftDay(ui.nscDate,1);render();break;
    case 'nsctoday':ui.nscDate=today();render();break;
    case 'nscview':ui.nscView=t.getAttribute('data-v');ui.nscMonth=ui.nscDate.slice(0,7);render();break;
    case 'goday':ui.nscDate=t.getAttribute('data-d');ui.nscView='day';render();break;
    case 'nscadd':nscForm();break;

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='gq'){ui.gq=t.value;applyGQ();}
  else if(t.id==='q'){var k=route();ui.q[k]=t.value;$('#list').innerHTML=listRows(k);}
  else if(t.id==='nscq'){ui.q.nsc=t.value;$('#nscBody').innerHTML=nscBodyHTML();}
  else if(t.id==='rpNotes'){ui.rpNotes=t.value;$('#rpPrev').innerHTML=previewHTML();}
  else if(/^rt_(ref|to|obj|note|cc|dest|time|drv|dco|tel|plate)$/.test(t.id)){ui.ret[t.id.slice(3)]=t.value;}
  else if(t.id==='bal_d'){ui.balD=t.value||today();render();}
  else if(/^lo_(ref|to|obj|note)$/.test(t.id)){ui.lo[t.id.slice(3)]=t.value;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='gsort'){ui.sort=t.value;render();}
  else if(t.id==='f_eu'){var uu=t.value==='l'?'L':'Gal';[['qin','Received'],['qout','Consumed'],['qret','Returned']].forEach(function(q){var lb=document.querySelector('label[for="f_'+q[0]+'"]');if(lb)lb.textContent=q[1]+' ('+uu+')';});}
  else if(t.getAttribute&&t.getAttribute('data-mv')){ui.mvOn[t.getAttribute('data-mv')]=t.checked;}
  else if(t.getAttribute&&t.getAttribute('data-rt')){ui.retOn[t.getAttribute('data-rt')]=t.checked;render();}
  else if(t.getAttribute&&t.getAttribute('data-ord')){var oc=route(),ol=S[oc],oi=ol&&ol.find(function(x){return x.id===t.getAttribute('data-ord');});if(oi){oi.ord=t.checked;commit(oc);render();}}
  else if(t.getAttribute&&t.getAttribute('data-rtf')){var pr=t.getAttribute('data-rtf').split('|'),rl=S[pr[0]],ri=rl&&rl.find(function(x){return x.id===pr[1];});if(ri){ri[pr[2]]=(pr[2]==='rv'||pr[2]==='ton')?(t.value===''?'':+t.value):t.value;commit(pr[0]);}}
  else if(t.getAttribute&&t.getAttribute('data-lof')){var q2=t.getAttribute('data-lof').split('|'),ql=S[q2[0]],qi=ql&&ql.find(function(x){return x.id===q2[1];});if(qi){qi.oq=t.value===''?'':+t.value;commit(q2[0]);}}
  else if(t.getAttribute&&t.getAttribute('data-lo')){ui.loOn[t.getAttribute('data-lo')]=t.checked;render();}
  else if(t.getAttribute&&t.getAttribute('data-tbr')){var tc=route(),tl=S[tc],ti=tl&&tl.find(function(x){return x.id===t.getAttribute('data-tbr');});if(ti){ti.tbr=t.checked;commit(tc);render();}}
  else if(t.id==='impFile'){var f=t.files&&t.files[0];if(f)importData(f);t.value='';}
  else if(t.id==='rpDate'&&t.value){ui.rpDate=t.value;render();}
  else if(t.id==='nscDate'&&t.value){ui.nscDate=t.value;render();}
  else if(t.id==='nscMonth'&&t.value){ui.nscMonth=t.value;render();}
  else if(t.getAttribute&&t.getAttribute('data-sec')){ui.rpOn[t.getAttribute('data-sec')]=t.checked;$('#rpPrev').innerHTML=previewHTML();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.getElementById('pv'))closePreview();else if(!$('#modal').hidden)closeForm();}});

lsLoad();
snapAll();
render();
(async function(){
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
  if(!db){setSync('local');return;}
  setSync('shared');
  try{
    db.collection('eb409').onSnapshot(function(snap){
      var hasC=false;
      snap.docs.forEach(function(d){
        if(KEYS.indexOf(d.id)<0)return;
        if(d.id==='cement')hasC=true;
        var x=d.data();
        if(x&&Array.isArray(x.rows)){
          if(dirty[d.id])base[d.id]=JSON.stringify(x.rows);
          else{S[d.id]=JSON.parse(JSON.stringify(x.rows));snap(d.id);}
        }
      });
      if(splitCement(S,!hasC)){persist('mud');persist('cement');}
      if(bitFix(S)){persist('bit');persist('casing');persist('acc');}
      if(hcFix(S))persist('headcount');
      if(nscFix(S))persist('nsc');
      if(migStore('eb409.mig.store0.db'))persist('store');
      lsSave();
      if($('#modal').hidden)render();
    },function(){setSync('error');});
  }catch(e){setSync('error');}
})();
})();
