{% extends 'base.html' %}
{% block title %}Confirmer la suppression{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-danger text-white"><h4>Confirmation de suppression</h4></div>
        <div class="card-body">
            <p>Êtes-vous sûr de vouloir supprimer : <strong>{{ tache }}</strong> ?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                <a href="{% url 'core:tache_list' %}" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
