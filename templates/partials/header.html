{% load i18n %}
<!-- templates/partials/header.html -->
<nav class="navbar navbar-dark bg-primary navbar-expand-lg shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard:index' %}">
            {% trans "Société Tunisienne d'Exploitation Pétrolière" %}
        </a>

        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
                <span class="text-white me-3">
                    {% trans "Bonjour" %}, <strong>{{ user.get_full_name|default:user.username }}</strong>
                </span>
            {% endif %}

            <!-- تبديل اللغة -->
            <div class="dropdown me-2">
                <button class="btn btn-light btn-sm dropdown-toggle" type="button" id="langDropdown" data-bs-toggle="dropdown">
                    {% if LANGUAGE_CODE == 'fr' %}🇫🇷 Français{% else %}🇸🇦 العربية{% endif %}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <form method="post" action="{% url 'set_language' %}" class="p-0 m-0">
                            {% csrf_token %}
                            <input type="hidden" name="language" value="fr">
                            <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'fr' %}active{% endif %}">
                                🇫🇷 Français
                            </button>
                        </form>
                    </li>
                    <li>
                        <form method="post" action="{% url 'set_language' %}" class="p-0 m-0">
                            {% csrf_token %}
                            <input type="hidden" name="language" value="ar">
                            <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'ar' %}active{% endif %}">
                                🇸🇦 العربية
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

            {% if user.is_authenticated %}
                <a href="{% url 'accounts:logout' %}" class="btn btn-outline-light btn-sm">{% trans "Déconnexion" %}</a>
            {% endif %}
        </div>
    </div>
</nav>
